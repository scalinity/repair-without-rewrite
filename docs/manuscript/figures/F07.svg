<svg xmlns="http://www.w3.org/2000/svg" width="900pt" height="830pt" viewBox="0 0 900 830" role="img" aria-labelledby="title desc"><title id="title">F07: Whole-output benefit and reference-aware oracle headroom</title><desc id="desc">CALCULATION — Better/equal/worse categories retain all 2,696 cases and the three prescribed fixed endpoint outputs. The reference-aware whole-output oracle is an unmistakably non-deployable ceiling: only RAW or a complete cached proposal may be selected, using the reference to compare errors; incomplete outputs choose RAW. RAW has 1,413 errors/50,926 words. Oracle errors 1,411/1,410/1,304 correspond to gains 2/3/109 across 2/3/36 of 52 groups. ByT5 headroom is 0.214036 WER pp, approximately 7.714% of RAW errors. Recorded descriptive 95% source-group gain intervals use 10,000 paired draws; point gains were independently reaggregated, but detailed oracle intervals were not fully requalified in v3. No source-only acceptance performance, new-population gain, edit mixing or checkpoint selection is shown.</desc><g font-family="Bitstream Vera Sans, DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="900" height="830" fill="#FFFFFF" stroke="none"/>
