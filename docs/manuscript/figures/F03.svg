<svg xmlns="http://www.w3.org/2000/svg" width="900pt" height="650pt" viewBox="0 0 900 650" role="img" aria-labelledby="title desc"><title id="title">F03: Completed repairs versus introduced errors</title><desc id="desc">MEASURED RESULT/CALCULATION — Completion-qualified repairs, raw repairs, introductions, output errors and invalid/incomplete cases for the three prescribed G2 endpoints and RAW identity. All natural G2 observations retain 2,696 cases, 50,926 reference words, 1,413 RAW errors and 52 groups. Repair rates use source errors; introduction rates use reference words. Alignment ranges are not statistical intervals. C101 raw conservation uses 20 repairs, whereas completed repair is 18. Failures are retained without bare-model fallback credit. The separate lexical-zero stratum uses 1,818 cases, not the repair denominator; error totals are counts. Its recorded detailed retrospective decomposition retains limited independent reconstruction.</desc><g font-family="Bitstream Vera Sans, DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="900" height="650" fill="#FFFFFF" stroke="none"/>
