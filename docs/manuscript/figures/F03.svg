<text x="36.000000" y="291.000000" font-size="10" fill="#53616D" text-anchor="start" font-weight="normal">RAW repair and introduction are zero by identity. Alignment ranges are identification bounds, not confidence intervals.</text>
<text x="36.000000" y="308.000000" font-size="10" fill="#53616D" text-anchor="start" font-weight="normal">Raw conservation: output errors = RAW errors - raw repair + introduced errors.</text>
<text x="36.000000" y="325.000000" font-size="10" fill="#53616D" text-anchor="start" font-weight="normal">C101 conservation uses 20 raw repairs; its 18 completion-qualified repairs are a distinct utility measure.</text>
