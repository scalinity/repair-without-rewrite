<svg xmlns="http://www.w3.org/2000/svg" width="900pt" height="790pt" viewBox="0 0 900 790" role="img" aria-labelledby="title desc"><title id="title">F01: Generation-1 scratch outcomes</title><desc id="desc">MEASURED RESULT — Six fixed seed-42 scratch endpoints at nominal 10M (actual 10,007,223 canonical exposures; 305 updates). The natural panel contains 108 cases, 2,270 words and 64 RAW errors (2.819383% WER). All endpoints fail natural adequacy; neither arm has a selected LR. Generated conformance (/288), genuine repaired cases (/192), and repaired fields (/288) are separately qualified and cannot substitute for natural repair. Decoder and structural failures remain visible. Repair/introduction ranges are alignment bounds; no sampling intervals are available here.</desc><g font-family="Bitstream Vera Sans, DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="900" height="790" fill="#FFFFFF" stroke="none"/>
