<svg xmlns="http://www.w3.org/2000/svg" width="900pt" height="1020pt" viewBox="0 0 900 1020" role="img" aria-labelledby="title desc"><title id="title">F06: D0 versus D1 natural repetition distributions</title><desc id="desc">CALCULATION — Exact natural repair frequency masses: D0 763 records presented 18 times and 261 presented 19 times; D1 8,688 presented once and 5,425 twice. Zero-presentation counts are zero. Denominators are 1,024/14,113 distinct records, with 18,693/19,538 presentations and means 18.254883/1.384397. Counts are finite ledger calculations, not independent-observation sample sizes, and no sampling bars are invented. Separate repair charge, first full repair pass, identity channel and phase accounting retain their original units. Charge-based pass equivalents (18.256312/1.386247 in E11) use full-pass charges 54,812/721,825 per the approved registry, not record counts. Increased diversity under approximately fixed charge is not a pure sample-count intervention or a test of sustained D1 training; more exposure helping is unproved.</desc><g font-family="Bitstream Vera Sans, DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="900" height="1020" fill="#FFFFFF" stroke="none"/>
